name: Network game / Сетевая игра
description: A problem with finding, joining or racing in a network game. / Проблема с поиском, подключением или гонкой по сети.
labels: ["network"]
body:
  - type: markdown
    attributes:
      value: |
        Network play is planned for a later stage and is not available in the browser build yet.
        This template is for protocol work and future browser multiplayer. / Сетевая игра запланирована отдельным этапом и в браузерной сборке пока недоступна. Шаблон — для работы над протоколом и будущего мультиплеера.
        **Never attach files of the original game.** / **Не прикладывайте файлы оригинальной игры.**
  - type: textarea
    id: what
    attributes:
      label: What happened / Что произошло
    validations:
      required: true
  - type: dropdown
    id: peers
    attributes:
      label: Players / Игроки
      options:
        - Wasm Unleashed with Wasm Unleashed
        - Wasm Unleashed with the original game / с оригинальной игрой
    validations:
      required: true
  - type: input
    id: network
    attributes:
      label: Network / Сеть
      description: LAN, VPN or internet; who hosts. / Локальная сеть, VPN или интернет; кто создаёт игру.
  - type: input
    id: version
    attributes:
      label: Version and browsers / Версия и браузеры
      description: Build or commit, and each player's browser. / Сборка или коммит и браузер каждого игрока.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Browser console / Консоль браузера (host and client / хост и клиент)
      render: text
