# The relay's per-client limits. A browser opens one WebSocket per game session, so the connection
# cap is about a household behind one address; the request rate is about handshake floods. Both
# keys are the browser's address, which `real_ip` below recovers from Caddy's header.
limit_conn_zone $binary_remote_addr zone=relayconn:10m;
limit_req_zone $binary_remote_addr zone=relayreq:10m rate=10r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Docker's embedded DNS. The relay name is resolved per request, so this image can start
    # without a relay (the CI smoke test does) and a relay restart is picked up without reloading.
    resolver 127.0.0.11 valid=10s ipv6=off;
    include /etc/nginx/mime.types;
    types { text/javascript mjs; }
    gzip on;
    gzip_vary on;
    gzip_types application/wasm text/javascript application/javascript application/json text/css;

    # Caddy on the host is the only public entry and connects to the published loopback port, so
    # nginx would otherwise see the docker gateway as the client and put every player in one bucket.
    # `real_ip` recovers the browser from Caddy's X-Forwarded-For, which keeps the log, the limits
    # below and the header the relay receives honest. A client that reaches nginx directly comes
    # from an address outside these networks, so its own header is ignored.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Blue-green probes. The deploy script creates /tmp/draining before stopping
    # the old container, so Caddy removes it from rotation before it shuts down.
    location = /healthz {
        if (-f /tmp/draining) { return 503; }
        access_log off;
        add_header Cache-Control "no-store";
        default_type text/plain;
        return 200 "ok\n";
    }

    # The browser's UDP relay. One WebSocket is one game peer; nginx only upgrades and forwards.
    location = /relay {
        # The relay is an unauthenticated UDP gateway by nature, so the edge bounds what one address
        # may hold open and how fast it may open it. The relay enforces the same rules again.
        limit_conn relayconn 8;
        limit_req zone=relayreq burst=20 nodelay;

        set $relay_upstream relay:8090;
        proxy_pass http://$relay_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The bundled relay believes these only from its proxy network, and overwrites are enough:
        # $remote_addr is the browser after `real_ip`, so a forwarded chain cannot be forged.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
    location /data/objects/ { gzip_static on; try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /data/manifest.json { try_files $uri =404; add_header Cache-Control "no-cache"; }
}
